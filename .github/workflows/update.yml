name: 📈 매일 시장 데이터 자동 업데이트

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00) 실행
    - cron: '0 0 * * 1-5'
  workflow_dispatch:   # 수동 실행 버튼도 활성화

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install yfinance requests

      - name: 시장 데이터 수집
        run: python scripts/fetch_data.py

      - name: auto.json 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/auto.json
          git diff --cached --quiet || git commit -m "chore: 시장 데이터 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
